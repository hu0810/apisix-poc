global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'apisix'
    static_configs:
      - targets: ['apisix:9091']  # APISIX metrics 端點

  - job_name: 'java-app'
    metrics_path: '/actuator/prometheus'  
    static_configs:
      - targets: ['java-app:8080']

